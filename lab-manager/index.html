                                                        value={customLengthUnit}
                                                        onChange={(e) => setCustomLengthUnit(e.target.value)}
                                                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-200 font-semibold focus:outline-none focus:border-amber-500 cursor-pointer"
                                                    >
                                                        <option value="in">in (inches)</option>
                                                        <option value="mm">mm (millimeters)</option>
                                                        <option value="cm">cm (centimeters)</option>
                                                        <option value="ft">ft (feet)</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <p className="text-[11px] text-slate-500 mt-1">
                                                Specify the exact rod, strip, or stock length for your build.
                                            </p>
                                        </div>
                                    )}

                                    {/* 3. CUSTOM DIMENSIONS / SPECIFICATIONS PROMPT */}
                                    {specModalItem.requiresDimPrompt && (
                                        <div>
                                            <label className="text-xs font-semibold text-slate-300 block mb-1">
                                                Custom Dimensions / Specification Details *
                                            </label>
                                            <input 
                                                type="text" 
                                                required
                                                placeholder="e.g. 1/2-inch eye loop, 120 grit, 2x4 cut..."
                                                value={customDimensionValue}
                                                onChange={(e) => setCustomDimensionValue(e.target.value)}
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-purple-500"
                                            />
                                            <p className="text-[11px] text-slate-500 mt-1">
                                                State specific gauge, diameter, grit, or dimension requirements.
                                            </p>
                                        </div>
                                    )}

                                    <div className="flex items-center justify-end gap-2 pt-3 border-t border-slate-800">
                                        <button 
                                            type="button" 
                                            onClick={() => setSpecModalItem(null)} 
                                            className="px-4 py-2 text-xs font-semibold text-slate-400 hover:text-slate-200 transition-colors"
                                        >
                                            Cancel
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-xl text-xs flex items-center gap-1.5 transition-colors shadow-lg shadow-sky-600/20"
                                        >
                                            <i data-lucide="check" className="w-4 h-4"></i>
                                            Add Spec to Cart
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: EDIT OR ADD ITEM WITH PHOTO & REQUIREMENT PROMPT TOGGLES (INSTRUCTOR) */}
                    {editingItem && (
                        <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                    <div className="flex items-center gap-2">
                                        <div className="p-1.5 rounded-lg bg-amber-950 text-amber-400 border border-amber-800">
                                            <i data-lucide={editingItem.isNew ? "plus-circle" : "edit-3"} className="w-4 h-4"></i>
                                        </div>
                                        <h3 className="font-bold text-slate-100 text-base">
                                            {editingItem.isNew ? 'Add New Item' : 'Edit Inventory Item'}
                                        </h3>
                                    </div>
                                    <button 
                                        type="button"
                                        onClick={() => setEditingItem(null)} 
                                        className="text-slate-400 hover:text-slate-200 p-1"
                                    >
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>

                                <form onSubmit={handleSaveItem} className="space-y-4">
                                    <div>
                                        <label className="text-xs font-semibold text-slate-300 block mb-1">
                                            Item Name *
                                        </label>
                                        <input 
                                            type="text" 
                                            required
                                            placeholder="e.g. 1/8 Wood Dowel, Cordless Drill..."
                                            value={editFormName}
                                            onChange={(e) => setEditFormName(e.target.value)}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="text-xs font-semibold text-slate-300 block mb-1">
                                            Category *
                                        </label>
                                        <select 
                                            value={editFormCategory}
                                            onChange={(e) => setEditFormCategory(e.target.value)}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-amber-500 cursor-pointer"
                                        >
                                            <option value="Power Tools">Power Tools</option>
                                            <option value="Hand Tools & Measuring">Hand Tools & Measuring</option>
                                            <option value="Drill Bits">Drill Bits</option>
                                            <option value="Motors & Power">Motors & Power</option>
                                            <option value="LEGO & Mechanics">LEGO & Mechanics</option>
                                            <option value="Gears">Gears</option>
                                            <option value="Glues & Tapes">Glues & Tapes</option>
                                            <option value="Raw Materials">Raw Materials</option>
                                        </select>
                                    </div>

                                    {/* Picture Source: URL, Local Upload or Camera Snap */}
                                    <div className="space-y-2 bg-slate-950 p-3 rounded-xl border border-slate-800">
                                        <label className="text-xs font-semibold text-slate-300 flex items-center justify-between">
                                            <span>Tool Picture / Photo</span>
                                            <span className="text-[10px] text-amber-400 font-mono">Custom Photo or Vector Schematic</span>
                                        </label>

                                        {/* Live Thumbnail Preview */}
                                        <div className="flex items-center gap-3">
                                            <div className="w-16 h-16 rounded-xl bg-slate-900 border border-slate-700 overflow-hidden flex-shrink-0 relative flex items-center justify-center p-1">
                                                <ToolSchematic item={{ 
                                                    id: editingItem.id || 'preview', 
                                                    name: editFormName, 
                                                    category: editFormCategory, 
                                                    imageUrl: editFormImageUrl 
                                                }} />
                                            </div>
                                            <div className="flex-1 space-y-1.5">
                                                <input 
                                                    type="url" 
                                                    placeholder="Paste Image URL (Optional)"
                                                    value={editFormImageUrl}
                                                    onChange={(e) => setEditFormImageUrl(e.target.value)}
                                                    className="w-full bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 font-mono focus:outline-none focus:border-amber-500"
                                                />
                                                <div className="flex items-center gap-2">
                                                    <label className="cursor-pointer px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-sky-300 hover:text-sky-200 border border-slate-700 rounded-md text-[11px] font-semibold flex items-center gap-1 transition-colors">
                                                        <i data-lucide="camera" className="w-3 h-3"></i>
                                                        <span>Take Photo / Upload File</span>
                                                        <input 
                                                            type="file" 
                                                            accept="image/*" 
                                                            className="hidden" 
                                                            onChange={(e) => {
                                                                const file = e.target.files && e.target.files[0];
                                                                if (!file) return;
                                                                const reader = new FileReader();
                                                                reader.onload = (event) => {
                                                                    const img = new Image();
                                                                    img.onload = () => {
                                                                        const canvas = document.createElement('canvas');
                                                                        const MAX_WIDTH = 640;
                                                                        const MAX_HEIGHT = 480;
                                                                        let width = img.width;
                                                                        let height = img.height;

                                                                        if (width > height) {
                                                                            if (width > MAX_WIDTH) {
                                                                                height *= MAX_WIDTH / width;
                                                                                width = MAX_WIDTH;
                                                                            }
                                                                        } else {
                                                                            if (height > MAX_HEIGHT) {
                                                                                width *= MAX_HEIGHT / height;
                                                                                height = MAX_HEIGHT;
                                                                            }
                                                                        }
                                                                        canvas.width = width;
                                                                        canvas.height = height;
                                                                        const ctx = canvas.getContext('2d');
                                                                        ctx.drawImage(img, 0, 0, width, height);
                                                                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.85);
                                                                        setEditFormImageUrl(compressedBase64);
                                                                        showToast('Image uploaded and preview updated!', 'success');
                                                                    };
                                                                    img.src = event.target.result;
                                                                };
                                                                reader.readAsDataURL(file);
                                                            }}
                                                        />
                                                    </label>
                                                    {editFormImageUrl && (
                                                        <button 
                                                            type="button"
                                                            onClick={() => setEditFormImageUrl('')}
                                                            className="text-[11px] text-slate-500 hover:text-rose-400"
                                                        >
                                                            Reset to Schematic
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-xs font-semibold text-slate-300 block mb-1">
                                            Educational Tool Description
                                        </label>
                                        <textarea 
                                            rows="2"
                                            placeholder="Explain what this tool or material is used for..."
                                            value={editFormDescription}
                                            onChange={(e) => setEditFormDescription(e.target.value)}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500"
                                        />
                                    </div>

                                    {/* Classification: Equipment vs Consumable */}
                                    <div className="space-y-2 bg-slate-950 p-3 rounded-xl border border-slate-800">
                                        <label className="text-xs font-semibold text-slate-300 block">Item Classification</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            <button
                                                type="button"
                                                onClick={() => setEditFormIsConsumable(false)}
                                                className={`py-2 px-3 rounded-lg text-xs font-semibold border flex items-center justify-center gap-1.5 transition-all ${
                                                    !editFormIsConsumable 
                                                        ? 'bg-sky-950 border-sky-600 text-sky-300' 
                                                        : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200'
                                                }`}
                                            >
                                                <i data-lucide="wrench" className="w-3.5 h-3.5"></i>
                                                Durable Equipment
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => setEditFormIsConsumable(true)}
                                                className={`py-2 px-3 rounded-lg text-xs font-semibold border flex items-center justify-center gap-1.5 transition-all ${
                                                    editFormIsConsumable 
                                                        ? 'bg-purple-950 border-purple-600 text-purple-300' 
                                                        : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200'
                                                }`}
                                            >
                                                <i data-lucide="box" className="w-3.5 h-3.5"></i>
                                                Consumable Supply
                                            </button>
                                        </div>
                                    </div>

                                    {/* Quantity & Unit */}
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-xs font-semibold text-slate-300 block mb-1">
                                                {editFormIsConsumable ? 'Batch Size / Count' : 'Total Quantity In Lab'}
                                            </label>
                                            <input 
                                                type="number" 
                                                min="1"
                                                value={editFormTotal}
                                                onChange={(e) => setEditFormTotal(Math.max(1, parseInt(e.target.value) || 1))}
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-slate-100 font-mono focus:outline-none focus:border-amber-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-xs font-semibold text-slate-300 block mb-1">
                                                Unit (pcs, sets, sticks...)
                                            </label>
                                            <input 
                                                type="text" 
                                                placeholder="pcs"
                                                value={editFormUnit}
                                                onChange={(e) => setEditFormUnit(e.target.value)}
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500"
                                            />
                                        </div>
                                    </div>

                                    {editFormIsConsumable && (
                                        <div className="flex items-center justify-between p-3 bg-slate-950 rounded-xl border border-slate-800">
                                            <span className="text-xs text-slate-300">Initial Supply Availability</span>
                                            <button
                                                type="button"
                                                onClick={() => setEditFormInStock(!editFormInStock)}
                                                className={`px-3 py-1 rounded-lg text-xs font-bold ${
                                                    editFormInStock ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-rose-950 text-rose-400 border border-rose-800'
                                                }`}
                                            >
                                                {editFormInStock ? 'In Stock' : 'Out of Stock'}
                                            </button>
                                        </div>
                                    )}

                                    {/* Student Prompt Requirement Controls */}
                                    <div className="space-y-2 bg-slate-950 p-3 rounded-xl border border-slate-800">
                                        <label className="text-xs font-semibold text-slate-300 block">
                                            Student Request Requirements (Optional)
                                        </label>
                                        <p className="text-[11px] text-slate-400 mb-2">
                                            Check which prompts students must answer when adding this item:
                                        </p>

                                        <div className="space-y-2">
                                            <label className="flex items-center gap-2 cursor-pointer text-xs text-slate-300">
                                                <input
                                                    type="checkbox"
                                                    checked={editFormRequiresQtyPrompt}
                                                    onChange={(e) => setEditFormRequiresQtyPrompt(e.target.checked)}
                                                    className="rounded bg-slate-900 border-slate-700 text-amber-500 focus:ring-amber-500"
                                                />
                                                <span>Prompt for custom quantity needed</span>
                                            </label>

                                            <label className="flex items-center gap-2 cursor-pointer text-xs text-slate-300">
                                                <input
                                                    type="checkbox"
                                                    checked={editFormRequiresLength}
                                                    onChange={(e) => setEditFormRequiresLength(e.target.checked)}
                                                    className="rounded bg-slate-900 border-slate-700 text-amber-500 focus:ring-amber-500"
                                                />
                                                <span>Prompt for cut length (with in/mm/cm/ft unit)</span>
                                            </label>

                                            <label className="flex items-center gap-2 cursor-pointer text-xs text-slate-300">
                                                <input
                                                    type="checkbox"
                                                    checked={editFormRequiresDimPrompt}
                                                    onChange={(e) => setEditFormRequiresDimPrompt(e.target.checked)}
                                                    className="rounded bg-slate-900 border-slate-700 text-amber-500 focus:ring-amber-500"
                                                />
                                                <span>Prompt for custom dimension / spec details</span>
                                            </label>
                                        </div>
                                    </div>

                                    <div className="flex items-center justify-between gap-2 pt-3 border-t border-slate-800">
                                        {!editingItem.isNew ? (
                                            <button 
                                                type="button" 
                                                onClick={() => {
                                                    const itemToDelete = editingItem;
                                                    setEditingItem(null);
                                                    setDeletingItem(itemToDelete);
                                                }} 
                                                className="px-3 py-2 text-xs font-semibold text-rose-400 hover:text-rose-300 hover:bg-rose-950/50 rounded-xl border border-rose-900/60 flex items-center gap-1.5 transition-colors"
                                            >
                                                <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                                                Delete Item
                                            </button>
                                        ) : <div></div>}

                                        <div className="flex items-center gap-2">
                                            <button 
                                                type="button" 
                                                onClick={() => setEditingItem(null)} 
                                                className="px-4 py-2 text-xs font-semibold text-slate-400 hover:text-slate-200 transition-colors"
                                            >
                                                Cancel
                                            </button>
                                            <button 
                                                type="submit" 
                                                className="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold rounded-xl text-xs flex items-center gap-1.5 transition-colors shadow-lg shadow-amber-600/20"
                                            >
                                                <i data-lucide="save" className="w-4 h-4"></i>
                                                {editingItem.isNew ? 'Create Item' : 'Save Changes'}
                                            </button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: CONFIRM ITEM DELETION */}
                    {deletingItem && (
                        <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-rose-900/50 rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl">
                                <div className="w-12 h-12 rounded-2xl bg-rose-950/80 border border-rose-800/80 text-rose-400 flex items-center justify-center mx-auto">
                                    <i data-lucide="alert-triangle" className="w-6 h-6"></i>
                                </div>
                                <div className="text-center space-y-1">
                                    <h3 className="font-bold text-slate-100 text-base">Delete Item from Catalog?</h3>
                                    <p className="text-xs text-slate-400">
                                        Are you sure you want to remove <span className="font-semibold text-slate-200">"{deletingItem.name}"</span>? This will permanently delete it from student catalogs.
                                    </p>
                                </div>
                                <div className="flex items-center justify-center gap-3 pt-2">
                                    <button 
                                        type="button"
                                        onClick={() => setDeletingItem(null)}
                                        className="flex-1 py-2 text-xs font-semibold text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-xl transition-colors"
                                    >
                                        Keep Item
                                    </button>
                                    <button 
                                        type="button"
                                        onClick={handleConfirmDeleteItem}
                                        className="flex-1 py-2 text-xs font-bold text-white bg-rose-600 hover:bg-rose-500 rounded-xl transition-colors shadow-lg shadow-rose-600/20 flex items-center justify-center gap-1.5"
                                    >
                                        <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                                        Delete
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: PRINTABLE WORKSHOP QR CODE POSTER */}
                    {isQRModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl relative">
                                <button 
                                    onClick={() => setIsQRModalOpen(false)}
                                    className="absolute top-4 right-4 text-slate-400 hover:text-slate-200 p-1"
                                >
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>
                                <div className="space-y-1">
                                    <span className="text-[10px] font-mono tracking-widest text-sky-400 uppercase font-bold">Classroom QR Access</span>
                                    <h3 className="text-lg font-bold text-slate-100">Scan for Student Portal</h3>
                                    <p className="text-xs text-slate-400">Students can point their phone camera here to request materials from their bench.</p>
                                </div>

                                <div className="bg-white p-4 rounded-2xl inline-block shadow-lg mx-auto">
                                    <div ref={qrRef} className="flex justify-center items-center"></div>
                                </div>

                                <div className="space-y-2 pt-2">
                                    <button 
                                        onClick={copyShareableLink}
                                        className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition-colors"
                                    >
                                        <i data-lucide="copy" className="w-3.5 h-3.5 text-sky-400"></i>
                                        Copy Link URL
                                    </button>
                                    <button 
                                        onClick={() => window.print()}
                                        className="w-full py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition-colors shadow-lg shadow-sky-600/30"
                                    >
                                        <i data-lucide="printer" className="w-3.5 h-3.5"></i>
                                        Print Workshop Wall Poster
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: REQUEST DENIAL REASON */}
                    {denialModalReq && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
                                <h3 className="font-bold text-slate-100 text-base flex items-center gap-2">
                                    <i data-lucide="alert-triangle" className="w-5 h-5 text-rose-400"></i>
                                    Deny Request for {denialModalReq.studentName}
                                </h3>
                                <div>
                                    <label className="text-xs text-slate-300 block mb-1">Reason for Denial:</label>
                                    <textarea 
                                        rows="3"
                                        placeholder="e.g. Safety goggles not worn, unreturned tools from last period, item currently reserved..."
                                        value={denialReason}
                                        onChange={(e) => setDenialReason(e.target.value)}
                                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-100 focus:outline-none focus:border-rose-500"
                                    />
                                </div>
                                <div className="flex items-center justify-end gap-2">
                                    <button 
                                        onClick={() => {
                                            setDenialModalReq(null);
                                            setDenialReason('');
                                        }}
                                        className="px-3 py-1.5 text-xs text-slate-400 hover:text-slate-200"
                                    >
                                        Cancel
                                    </button>
                                    <button 
                                        onClick={handleDeny}
                                        className="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold rounded-xl transition-colors"
                                    >
                                        Confirm Denial
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
