    <!-- Use one Firebase project and one fixed classroom path on every device.
         Firebase Web config is public connection information, not an admin credential. -->
    <script>
        window.LAB_CONNECTION = {
  "firebaseConfig": {
    "apiKey": "AIzaSyAjF4FbLRVAIFQUTKFx7z6oj8cNVj-PxEU",
    "authDomain": "pre-englabtrack.firebaseapp.com",
    "projectId": "pre-englabtrack",
    "storageBucket": "pre-englabtrack.firebasestorage.app",
    "messagingSenderId": "317061817972",
    "appId": "1:317061817972:web:60634a37ebcd70edccd321"
  }
};
        window.LAB_RULES = "rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    function signedIn() { return request.auth != null; }\n    function teacher() {\n      return signedIn() && exists(/databases/$(database)/documents/teachers/$(request.auth.uid))\n        && get(/databases/$(database)/documents/teachers/$(request.auth.uid)).data.enabled == true;\n    }\n    match /teachers/{uid} {\n      allow get: if signedIn() && request.auth.uid == uid;\n      allow list, create, update, delete: if false;\n    }\n    match /artifacts/brown-preengineering/public/data/inventory/{id} {\n      allow read: if signedIn();\n      allow write: if teacher();\n    }\n    match /artifacts/brown-preengineering/public/data/meta/{id} {\n      allow read, write: if teacher();\n    }\n    match /artifacts/brown-preengineering/public/data/requests/{id} {\n      allow get: if teacher() || (signedIn() && (!exists(/databases/$(database)/documents/artifacts/brown-preengineering/public/data/requests/$(id)) || resource.data.ownerUid == request.auth.uid));\n      allow list: if teacher() || (signedIn() && resource.data.ownerUid == request.auth.uid);\n      allow create: if teacher() || (signedIn()\n        && request.resource.data.keys().hasOnly(['ownerUid','studentName','studentPeriod','projectName','expectedReturn','items','status','createdAt','requestTimestamp','notes'])\n        && request.resource.data.ownerUid == request.auth.uid\n        && request.resource.data.status == 'Pending'\n        && request.resource.data.notes == ''\n        && request.resource.data.studentName is string && request.resource.data.studentName.size() > 0 && request.resource.data.studentName.size() <= 150\n        && request.resource.data.studentPeriod is string && request.resource.data.studentPeriod.size() <= 100\n        && request.resource.data.projectName is string && request.resource.data.projectName.size() > 0 && request.resource.data.projectName.size() <= 500\n        && request.resource.data.expectedReturn is string && request.resource.data.expectedReturn.size() <= 100\n        && request.resource.data.createdAt is string\n        && request.resource.data.requestTimestamp is string\n        && request.resource.data.items is list && request.resource.data.items.size() > 0 && request.resource.data.items.size() <= 100);\n      allow update, delete: if teacher();\n    }\n  }\n}";
        window.LAB = {
            settings: null, status: {phase:'setup', message:'Connect your Firebase project to enable live requests.'},
            publish(status) { this.status = status; window.dispatchEvent(new Event('lab-connection')); },
            parseConfig(text) {
                let config;
                try { config = JSON.parse(text); config = config.firebaseConfig || config; }
                catch (_) {
                    config = {};
                    for (const key of ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId','measurementId']) {
                        const m = text.match(new RegExp('(?:["\\\']?' + key + '["\\\']?)\\s*:\\s*["\\\']([^"\\\']+)["\\\']'));
                        if(m) config[key] = m[1];
                    }
                }
                if(!config.apiKey || !config.projectId || !config.authDomain || !config.appId || config.projectId==='demo-project' || config.apiKey==='demo-api-key')
                    throw new Error('Paste the real Firebase Web app config from Project settings. Demo values do not work.');
                return {firebaseConfig:config};
            },
            async start() {
                let settings=window.LAB_CONNECTION;
                if(!settings) { try {settings=JSON.parse(localStorage.getItem('labtrack-live-connection-v1') || 'null');} catch(_){} }
                if(!settings) return;
                try {
                    this.settings=this.parseConfig(JSON.stringify(settings));
                    this.publish({phase:'loading',message:'Loading Firebase connection…'});
                    const [appSDK,authSDK,fs] = await Promise.all([
                        import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js'),
                        import('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js'),
                        import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js')
                    ]);
                    const app=appSDK.initializeApp(this.settings.firebaseConfig);
                    window.FB={...authSDK,...fs,appId:'brown-preengineering',db:fs.getFirestore(app),auth:authSDK.getAuth(app)};
                    this.publish({phase:'ready',message:'Firebase loaded; connecting to classroom data…'});
                } catch(err) { this.publish({phase:'error',message:(err.code || 'Connection error')+': '+err.message}); }
            }
        };
        window.LAB.start();
    </script>


    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // Persistent Custom Images Cache Helper
        // Stores uploaded base64 photos and custom links so they NEVER get lost or overwritten
        const IMAGE_CACHE_KEY = 'labtrack_custom_images_cache_v1';

        const getCachedImages = () => {
            try {
                const stored = localStorage.getItem(IMAGE_CACHE_KEY);
                return stored ? JSON.parse(stored) : {};
            } catch (e) {
                return {};
            }
        };

        const saveCachedImage = (itemId, imageUrl) => {
            try {
                const cache = getCachedImages();
                if (imageUrl && imageUrl.trim()) {
                    cache[itemId] = imageUrl;
                } else {
                    delete cache[itemId];
                }
                localStorage.setItem(IMAGE_CACHE_KEY, JSON.stringify(cache));
            } catch (e) {
                console.warn('Local image cache write warning:', e);
            }
        };

        // Merge cached custom pictures into inventory items
        const applyCachedImages = (itemsList) => {
            const cache = getCachedImages();
            return itemsList.map(item => {
                if (cache[item.id] && (!item.imageUrl || item.imageUrl.trim() === '')) {
                    return { ...item, imageUrl: cache[item.id] };
                }
                return item;
            });
        };

        // Accurate Vector Technical Schematics Generator
        // Renders realistic, engineering-accurate diagrams so students learn exact physical tool shapes
        function ToolSchematic({ item, size = "card" }) {
            const id = item.id || '';
            const name = (item.name || '').toLowerCase();
            const cat = item.category || '';

            // Color paletting for technical schematics
            const bgClass = "w-full h-full flex items-center justify-center p-3 select-none";

            // If user uploaded a custom photo or provided a web URL, prioritize displaying their real photo!
            // Enhanced with object-contain and subtle contrast background so small hardware (like screw eyes) doesn't get cropped
            if (item.imageUrl && item.imageUrl.trim() !== '') {
                return (
                    <div className="w-full h-full flex items-center justify-center bg-slate-950/90 p-1.5 relative group">
                        <img 
                            src={item.imageUrl} 
                            alt={item.name} 
                            className="max-w-full max-h-full object-contain filter drop-shadow-md rounded transition-transform group-hover:scale-105"
                            onError={(e) => {
                                e.target.style.display = 'none';
                            }}

                    </div>
                );
            }

            // Accurate Vector Schematics based on exact engineering tool profiles

                            <rect x="80" y="55" width="4" height="7" fill="#ef4444"/>

                // 2. DRILL PRESS
                if (id === 'inv-pt-2' || name.includes('drill press')) {

                            <rect x="52" y="88" width="18" height="12" rx="2" fill="#334155"/>
                            {/* Motor & Pulley Belt Head */}
                            <rect x="45" y="18" width="68" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" strokeWidth="2"/>
                            <rect x="35" y="22" width="14" height="16" rx="2" fill="#1e293b" stroke="#38bdf8" strokeWidth="1"/>
                            {/* Spindle & Drill Chuck */}
                            <rect x="88" y="42" width="10" height="14" fill="#64748b" stroke="#94a3b8"/>
                            <polygon points="90,56 96,56 94,66 92,66" fill="#f59e0b"/>
                            {/* 3-Spoke Feed Plunge Handles */}
                            <circle cx="108" cy="30" r="4" fill="#f8fafc"/>
                            <line x1="108" y1="30" x2="124" y2="20" stroke="#f8fafc" strokeWidth="2"/>

                            <line x1="108" y1="30" x2="98" y2="16" stroke="#f8fafc" strokeWidth="2"/>

                }

                // 3. CORDLESS DRILL / IMPACT DRIVER / ELECTRIC SCREWDRIVER
                if (id === 'inv-pt-3' || id === 'inv-pt-5' || name.includes('cordless drill') || name.includes('impact driver')) {
                    const isImpact = name.includes('impact');

                            <circle cx="104" cy="60" r="8" fill="#0f172a"/>

                            {/* Chuck (Keyless for Drill / 1/4" Hex for Impact) */}
                            {isImpact ? (

                            ) : (
                                <polygon points="30,51 16,55 16,65 30,69" fill="#0f172a" stroke="#94a3b8" strokeWidth="1.5"/>

                            <rect x="8" y="58" width="10" height="4" fill="#cbd5e1"/>

                if (id === 'inv-pt-4' || name.includes('electric screwdriver')) {

                        <svg viewBox="0 0 160 160" className="w-full h-full max-h-36 drop-shadow-md">
                            {/* Slim cylindrical body */}

                            <rect x="87" y="74" width="8" height="6" rx="1" fill="#f43f5e"/>
                            {/* Hex Chuck & Bit */}
                            <rect x="30" y="73" width="15" height="16" fill="#475569" stroke="#94a3b8"/>
                            <rect x="12" y="78" width="18" height="6" fill="#cbd5e1" stroke="#475569"/>
                            <polygon points="12,78 4,81 12,84" fill="#94a3b8"/>
                            <text x="80" y="112" fill="#38bdf8" fontSize="8" fontFamily="monospace" textAnchor="middle">ELECTRIC SCREWDRIVER</text>
                        </svg>
                    );
                }

                // 5. HOT GLUE GUN
                if (id === 'inv-pt-6' || name.includes('glue gun')) {
                    return (
                        <svg viewBox="0 0 160 160" className="w-full h-full max-h-36 drop-shadow-md">
                            {/* Glue Stick protruding rear */}
                            <rect x="110" y="54" width="34" height="12" rx="2" fill="#e2e8f0" stroke="#94a3b8" strokeDasharray="2 2"/>
                            {/* Gun Body */}
                            <path d="M 40,50 L 115,50 C 118,50 120,53 120,56 L 120,70 L 102,72 L 95,125 C 95,128 92,130 88,130 L 72,130 C 69,130 67,128 67,125 L 75,74 L 40,74 Z" fill="#0284c7" stroke="#38bdf8" strokeWidth="2"/>
                            {/* Heat Chamber */}
                            <rect x="42" y="52" width="25" height="20" fill="#f97316"/>
                            {/* Metal Nozzle tip */}
                            <polygon points="40,56 22,60 22,64 40,68" fill="#e2e8f0" stroke="#fbbf24" strokeWidth="1.5"/>
                            <circle cx="18" cy="62" r="3" fill="#fbbf24"/>
                            {/* Trigger */}

                // 6. SCREWDRIVERS (Phillips vs Flathead)
                if (id === 'inv-ht-1' || id === 'inv-ht-2' || name.includes('screwdriver')) {
                    const isPhillips = name.includes('phillips') || id === 'inv-ht-1';
                    return (

                // 9. PLIERS (Needle Nose vs Slip Joint vs Channellock)

            const addItemToCartWithSpec = (item, requestedQty = 1, specifiedLength = null, specifiedDim = null) => {
                const specSuffix = [
                    specifiedLength ? `len-${specifiedLength.replace(/\s+/g, '')}` : '',
                    specifiedDim ? `dim-${specifiedDim.replace(/\s+/g, '')}` : ''
                ].filter(Boolean).join('-');

                const cartKey = item.id + (specSuffix ? `-${specSuffix}` : '');
                const existing = cartItems.find(c => c.cartKey === cartKey);
                const finalQty = Math.max(1, parseInt(requestedQty) || 1);

                if (existing) {
                    const newTotal = existing.qty + finalQty;
                    if (!item.isConsumable && newTotal > item.available) {
                        showToast(`Cannot exceed total available stock (${item.available})`, 'warning');
                        return;
                    }
                    setCartItems(cartItems.map(c => c.cartKey === cartKey ? { ...c, qty: newTotal } : c));
                } else {
                    let displayName = item.name;
                    const tags = [];
                    if (specifiedLength) tags.push(`Length: ${specifiedLength}`);
                    if (specifiedDim) tags.push(`Spec: ${specifiedDim}`);
                    if (tags.length > 0) displayName += ` [${tags.join(', ')}]`;

                    setCartItems([...cartItems, { 
                        cartKey,
                        itemId: item.id, 
                        baseName: item.name,
                        itemName: displayName, 
                        qty: finalQty, 
                        unit: item.unit || 'pcs', 
                        category: item.category,
                        isConsumable: !!item.isConsumable,
                        specifiedLength: specifiedLength || null,
                        specifiedDim: specifiedDim || null,
                        imageUrl: item.imageUrl
                    }]);

                showToast(`Added ${item.name} (x${finalQty}) to request cart`, 'success');
            };

                const formattedLength = specModalItem.requiresLength ? `${customLengthValue.trim()} ${customLengthUnit}` : null;

            }, []);
            useEffect(() => {
                if(cloudStatus.phase!=='ready'||!window.FB)return;
                let active=true,revision=0;
                const fb=window.FB;
                const unsubscribe=fb.onAuthStateChanged(fb.auth,async user=>{
                    const current=++revision;
                    if(!active)return;
                    setAuthUser(user);setIsFirebaseReady(true);setRequests([]);setIsInstructorUnlocked(false);
                    if(user && !user.isAnonymous){
                        try {
                            const marker=await fb.getDoc(fb.doc(fb.db,'teachers',user.uid));
                            if(active && current===revision) setIsInstructorUnlocked(marker.exists() && marker.data().enabled===true);
                        } catch(err) {if(active)setCloudError((err.code||'Teacher check')+': '+err.message)}
                    }
                });
                if(!fb.auth.currentUser)fb.signInAnonymously(fb.auth).catch(err=>{if(active)setCloudError((err.code||'Authentication')+': '+err.message)});
                return ()=>{active=false;unsubscribe()};
            }, [cloudStatus.phase]);
            useEffect(() => {
                if(!isFirebaseReady||!authUser||!window.FB)return;
                const {db,appId,collection,onSnapshot,query,where}=window.FB;
                setRequests([]);setRequestsOnline(false);setInventoryOnline(false);setCloudError('');
                const col=collection(db,'artifacts',appId,'public','data','requests');
                const q=isInstructorUnlocked && role==='instructor'?col:query(col,where('ownerUid','==',authUser.uid));
                const unsubReq=onSnapshot(q,{includeMetadataChanges:true},snapshot=>{
                    const fetched=snapshot.docs.map(d=>({...d.data(),id:d.id}));
                    fetched.sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
                    setRequests(fetched);setRequestsOnline(!snapshot.metadata.fromCache);
                },err=>{setRequestsOnline(false);setCloudError((err.code||'Requests')+': '+err.message)});
                const unsubInv=onSnapshot(collection(db,'artifacts',appId,'public','data','inventory'),{includeMetadataChanges:true},snapshot=>{
                    const periodDoc=snapshot.docs.find(d=>d.id===PERIOD_SETTINGS_ID);
                    const sharedPeriods=normalizePeriodOptions(periodDoc?.data()?.periodOptions);
                    setPeriodOptions(sharedPeriods);
                    setStudentPeriod(current=>sharedPeriods.includes(current)?current:'');
                    const projectDoc=snapshot.docs.find(d=>d.id===PROJECT_SETTINGS_ID);
                    const options=normalizeProjectOptions(projectDoc?.data()?.projectOptions);
                    setProjectOptions(options);
                    setProjectName(current=>options.includes(current)?current:options[0]);
                    const fetched=snapshot.docs.filter(d=>d.id!==PROJECT_SETTINGS_ID && d.id!==PERIOD_SETTINGS_ID).map(d=>({...d.data(),id:d.id}));
                    const order=new Map(INITIAL_INVENTORY.map((i,k)=>[i.id,k]));
                    fetched.sort((a,b)=>(order.get(a.id)??9999)-(order.get(b.id)??9999)||a.name.localeCompare(b.name));
                    setInventory(fetched);setInventoryEmpty(fetched.length===0);setInventoryOnline(!snapshot.metadata.fromCache);
                },err=>{setInventoryOnline(false);setCloudError((err.code||'Inventory')+': '+err.message)});
                return ()=>{unsubReq();unsubInv()};
            }, [isFirebaseReady,authUser?.uid,isInstructorUnlocked,role]);
            useEffect(()=>{
                const offline=()=>{setRequestsOnline(false);setInventoryOnline(false);setCloudError('Device is offline. Requests have not been sent to the teacher.');};
                window.addEventListener('offline',offline);
                return ()=>window.removeEventListener('offline',offline);
            },[]);

            // Initial load check for cached images
            useEffect(() => {
                setInventory(prev => applyCachedImages(prev));
            }, []);

            const handleSubmitCartRequest = async (e) => {
                e.preventDefault();
                if (cartItems.length === 0) {
                    showToast('Your request cart is empty! Add tools or materials first.', 'warning');
                    return;
                }

                if ((cartRequiresSafety && !agreedSafety) || !agreedCleanReturn) {
                    showToast(cartRequiresSafety ? 'Please check the safety and cleanup agreements before submitting.' : 'Please check the cleanup agreement before submitting.', 'warning');
                    return;
                }


                if(submittingRef.current)return;
                try {
                    requireConnection();
                    if(!studentName.trim()||!projectOptions.includes(projectName)||!periodOptions.includes(studentPeriod))throw new Error('Enter your name and choose a listed class period and project.');
                    if(cartItems.length>100)throw new Error('Use at most 100 request lines.');
                    if(periodNeedsGroup(studentPeriod) && !GROUP_OPTIONS.includes(studentGroup))throw new Error('Choose your group.');
                    submittingRef.current=true;
                    const {db,appId,doc,getDocFromServer,setDoc}=window.FB;
                    const canonical=cartItems.map(line=>{
                        const stock=inventory.find(i=>i.id===line.itemId);
                        if(!stock||!Number.isSafeInteger(line.qty)||line.qty<1)throw new Error('Invalid item or quantity.');
                        if(stock.requiresLength&&!line.specifiedLength)throw new Error('A cut length is required for '+stock.name);
                        return {...line,itemName:stock.name,isConsumable:stock.isConsumable,studentGroup:periodNeedsGroup(studentPeriod)?studentGroup:''};
                    });
                    const base={ownerUid:authUser.uid,studentName:studentName.trim(),studentPeriod,projectName:projectName.trim(),expectedReturn:'',items:canonical,status:'Pending',notes:''};
                    const fingerprint=JSON.stringify(base);
                    if(!submissionRef.current||submissionRef.current.fingerprint!==fingerprint){
                        const ref=doc(window.FB.collection(db,'artifacts',appId,'public','data','requests'));
                        submissionRef.current={fingerprint,ref,createdAt:new Date().toISOString()};
                    }
                    const pending=submissionRef.current;
                    const existing=await getDocFromServer(pending.ref);
                    if(!existing.exists())await setDoc(pending.ref,{...base,createdAt:pending.createdAt,requestTimestamp:new Date(pending.createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
                    submissionRef.current=null;
                    showToast('Request saved to the classroom database.','success');
                    setCartItems([]);setAgreedSafety(false);setAgreedCleanReturn(false);setActiveTab('my_status');
                } catch(err) {
                    setCloudError((err.code||'Submit')+': '+err.message);
                    showToast('Request not confirmed. Your cart has been kept.','error');
                } finally {submittingRef.current=false}
            };


            const updateRequestStatus = async (req,expected,fields) => {
                requireConnection(true);
                const {db,appId,doc,runTransaction}=window.FB;
                await runTransaction(db,async tx=>{
                    const ref=doc(db,'artifacts',appId,'public','data','requests',req.id);
                    const snap=await tx.get(ref);
                    if(!snap.exists()||snap.data().status!==expected)throw new Error('Request status changed. Refresh and try again.');
                    tx.update(ref,fields);
                });
            };
            // Per-item decisions in the approval queue: {requestId: {lineIndex: true}} marks a line as denied.
            const [deniedLines, setDeniedLines] = useState({});
            const toggleLineDenied = (reqId, idx) => setDeniedLines(prev => {
                const rows = {...(prev[reqId] || {})};
                if (rows[idx]) delete rows[idx]; else rows[idx] = true;
                return {...prev, [reqId]: rows};
            });
            const handleApprove = async req => {
                const denied = deniedLines[req.id] || {};
                const items = req.items || [];
                const keep = items.filter((_, i) => !denied[i]);
                const dropped = items.filter((_, i) => denied[i]);
                if (!keep.length) { setDenialModalReq(req); return; }
                const notes = dropped.length
                    ? 'Approved for pickup at bench desk. Not approved: ' + dropped.map(i => i.itemName + ' (x' + i.qty + ')').join(', ') + '.'
                    : 'Approved for pickup at bench desk.';
                const fields = {status:'Approved',notes,approvedAt:new Date().toISOString(),approvedBy:authUser.uid};
                if (dropped.length) { fields.items = keep; fields.deniedItems = dropped; }
                try {
                    await updateRequestStatus(req,'Pending',fields);
                    setDeniedLines(prev => { const n = {...prev}; delete n[req.id]; return n; });
                    showToast(dropped.length ? `Approved ${keep.length} of ${items.length} items.` : 'Request approved.','success');
                }
                catch(err){setCloudError(err.message);showToast('Approval was not saved.','error')}
            };
            const handleDeny = async () => {
                if(!denialModalReq)return;
                try {await updateRequestStatus(denialModalReq,'Pending',{status:'Denied',notes:denialReason||'Denied by instructor.'});setDenialModalReq(null);setDenialReason('');showToast('Request declined.','info')}
                catch(err){setCloudError(err.message);showToast('Decline was not saved.','error')}
            };

            const changeCustody = async req => {
                requireConnection(true);
                const {db,appId,doc,runTransaction}=window.FB;
                await runTransaction(db,async tx=>{
                    const requestRef=doc(db,'artifacts',appId,'public','data','requests',req.id);
                    const requestSnap=await tx.get(requestRef),record=requestSnap.data();
                    if(!requestSnap.exists()||record.status!=='Approved')throw new Error('This request was already handed out or its status changed.');
                    const counts=new Map();
                    for(const line of record.items){
                        if(!Number.isSafeInteger(line.qty)||line.qty<1)throw new Error('Invalid requested quantity.');
                        counts.set(line.itemId,(counts.get(line.itemId)||0)+line.qty);
                    }
                    const entries=new Map();
                    for(const [id,qty] of counts){
                        const ref=doc(db,'artifacts',appId,'public','data','inventory',id),snap=await tx.get(ref);
                        if(!snap.exists())throw new Error('A requested item was removed. Review the request.');
                        const stock=snap.data();
                        if(stock.isConsumable){if(stock.inStock===false)throw new Error(stock.name+' is out of stock.');}
                        else if(!Number.isSafeInteger(stock.available)||qty>stock.available)throw new Error('Insufficient or invalid stock for '+stock.name);
                        entries.set(id,{ref,stock,qty});
                    }
                    const issuedLines=record.items.map((line,index)=>({...line,
                        loanLineId:loanLineKey(line,index),isConsumable:!!entries.get(line.itemId).stock.isConsumable,
                        returnRequired:!entries.get(line.itemId).stock.isConsumable,returnedQty:0,damagedQty:0
                    }));
                    for(const {ref,stock,qty} of entries.values())if(!stock.isConsumable)tx.update(ref,{available:stock.available-qty});
                    const needsReturns=issuedLines.some(returnRequired);
                    tx.update(requestRef,{items:issuedLines,status:needsReturns?'Checked Out':'Completed',
                        checkoutTime:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),checkedOutAt:new Date().toISOString(),handedOutBy:authUser.uid,
                        notes:needsReturns?'Items handed out; returnable items remain outstanding.':'Consumables issued; no returns expected.'});
                });
            };
            const handleCheckoutHandout = async req => {
                try {await changeCustody(req);showToast('Handout saved to the shared database.','success')}
                catch(err){setCloudError(err.message);showToast('Handout not saved. Stock has not been changed.','error')}
            };
            const updateReturnSelection = (req,line,index,changes) => {
                const key=loanLineKey(line,index);
                setReturnSelections(prev=>{
                    const rows={...(prev[req.id]||{})};
                    if(changes.selected===false)delete rows[key];
                    else rows[key]={qty:lineOutstanding(line),condition:'Good',expectedAccounted:lineAccounted(line),...rows[key],...changes};
                    return {...prev,[req.id]:rows};
                });
            };
            const recordSelectedReturns = async (req,selections,operationId) => {
                requireConnection(true);
                const {db,appId,doc,runTransaction}=window.FB;
                return await runTransaction(db,async tx=>{
                    const requestRef=doc(db,'artifacts',appId,'public','data','requests',req.id);
                    const snap=await tx.get(requestRef);
                    if(!snap.exists())throw new Error('Request no longer exists.');
                    const record=snap.data();
                    if((record.returnEvents||[]).some(e=>e.id===operationId))return;
                    if(!activeLoan(record))throw new Error('This request has already been closed or changed.');
                    const keys=Object.keys(selections),lines=record.items.map((line,index)=>({...line,loanLineId:loanLineKey(line,index)}));
                    if(!keys.length){
                        if(lines.some(line=>lineOutstanding(line)>0))throw new Error('Check at least one item to return.');
                        tx.update(requestRef,{status:'Completed',notes:'Consumables issued; no returns expected.'});return;
                    }
                    const adjustments=new Map(),events=[];
                    for(const key of keys){
                        const selection=selections[key],line=lines.find(l=>l.loanLineId===key);
                        if(!line||!returnRequired(line))throw new Error('This item does not require a return.');
                        const qty=Number(selection.qty);
                        if(selection.expectedAccounted!==lineAccounted(line))throw new Error('An item was checked in on another device. Clear this selection and select the remaining items again.');
                        if(!Number.isSafeInteger(qty)||qty<1||qty>lineOutstanding(line))throw new Error('Return quantity must be between 1 and the quantity still outstanding.');
                        if(!['Good','Damaged'].includes(selection.condition))throw new Error('Choose the condition of each selected item.');
                        const totals=adjustments.get(line.itemId)||{good:0,damaged:0};
                        if(selection.condition==='Good'){totals.good+=qty;line.returnedQty=(line.returnedQty||0)+qty;}
                        else {totals.damaged+=qty;line.damagedQty=(line.damagedQty||0)+qty;}
                        adjustments.set(line.itemId,totals);
                        events.push({lineId:key,itemId:line.itemId,qty,condition:selection.condition});
                    }
                    const stocks=[];
                    for(const [id,totals] of adjustments){
                        const ref=doc(db,'artifacts',appId,'public','data','inventory',id),stock=await tx.get(ref);
                        if(!stock.exists())throw new Error('A selected inventory item was removed. Restore it before checking it in.');
                        if(!Number.isSafeInteger(stock.data().available)||stock.data().available<0)throw new Error('Correct the stock count before checking this item in.');
                        stocks.push({ref,stock:stock.data(),...totals});
                    }
                    for(const {ref,stock,good,damaged} of stocks){
                        const fields={available:stock.available+good};
                        if(damaged){fields.quarantined=(stock.quarantined||0)+damaged;fields.condition='Inspection needed';}
                        tx.update(ref,fields);
                    }
                    const remaining=lines.reduce((n,line)=>n+lineOutstanding(line),0),at=new Date().toISOString();
                    const fields={items:lines,status:remaining?'Partially Returned':'Returned',lastReturnAt:at,
                        returnEvents:[...(record.returnEvents||[]),{id:operationId,at,by:authUser.uid,items:events}],
                        notes:remaining?`${remaining} returnable item(s) still outstanding.`:'All returnable items accounted for.'};
                    if(!remaining){fields.returnedAt=at;fields.returnedBy=authUser.uid;fields.returnCondition=lines.some(l=>l.damagedQty>0)?'Includes damaged items':'Good';}
                    tx.update(requestRef,fields);
                });
            };
            const handleSaveSelectedReturns = async req => {
                if(returnSaveLocks.current.has(req.id))return;
                returnSaveLocks.current.add(req.id);setSavingReturns(prev=>({...prev,[req.id]:true}));
                try {
                    const selections=returnSelections[req.id]||{};
                    await recordSelectedReturns(req,selections,'return-'+Date.now().toString(36)+Math.random().toString(36).slice(2));
                    setReturnSelections(prev=>{const next={...prev};delete next[req.id];return next});
                    showToast('Selected items checked in. Unreturned items remain outstanding.','success');
                }catch(err){setCloudError(err.message);showToast(err.message,'error');}
                finally{returnSaveLocks.current.delete(req.id);setSavingReturns(prev=>({...prev,[req.id]:false}));}
            };

            const adjustStock = async (id,delta) => {
                try {
                    requireConnection(true);
                    const {db,appId,doc,runTransaction}=window.FB;
                    await runTransaction(db,async tx=>{
                        const ref=doc(db,'artifacts',appId,'public','data','inventory',id),snap=await tx.get(ref);
                        if(!snap.exists())throw new Error('Item no longer exists.');
                        const current=snap.data(),total=Math.max(0,(current.total??0)+delta),available=current.available+(total-current.total);
                        if(available<0)throw new Error('Return a checked-out item before reducing this total.');
                        tx.update(ref,{total,available});
                    });
                } catch(err){showToast(err.message,'error');}
            };

            const handleToggleConsumableStock = async (item) => {
                try {requireConnection(true)} catch(err) {showToast(err.message,'error');return;}
                const updatedStock = item.inStock === false ? true : false;

                            inStock: updatedStock
                        });
                    } else {
                        setInventory(inventory.map(i => i.id === item.id ? { ...i, inStock: updatedStock } : i));

                    showToast(`${item.name} marked as ${updatedStock ? 'In Stock' : 'Out of Stock'}`, 'info');
                } catch (err) {
                    showToast('Error updating stock status', 'error');
                }
            };


            const handleUnlockInstructor = async e => {
                e.preventDefault();
                try {
                    if(!window.FB)throw new Error('Configure the Firebase connection first.');
                    const fb=window.FB;
                    await fb.setPersistence(fb.auth,fb.browserSessionPersistence);
                    const credentials=await fb.signInWithEmailAndPassword(fb.auth,instructorEmail.trim(),instructorPin);
                    const marker=await fb.getDoc(fb.doc(fb.db,'teachers',credentials.user.uid));
                    if(!marker.exists()||marker.data().enabled!==true){await fb.signOut(fb.auth);await fb.signInAnonymously(fb.auth);throw new Error('This account is not enabled as an instructor. Add its teachers/{UID} document in Firebase.');}
                    setInstructorPin('');setIsInstructorUnlocked(true);setRole('instructor');setActiveTab('requests');
                    showToast('Instructor signed in.','success');
                } catch(err) {setCloudError((err.code||'Sign-in')+': '+err.message);showToast('Instructor sign-in failed.','error')}
            };

            // Filtered Items (with subtab filtering for equipment vs consumables)
            const filteredInventory = useMemo(() => {
                return inventory.filter(i => {
                    const matchesQuery = i.name.toLowerCase().includes(searchQuery.toLowerCase());
                    const matchesCat = categoryFilter === 'All' || i.category === categoryFilter;
                    
                    let matchesType = true;
                    if (catalogSubTab === 'equipment') {
                        matchesType = !i.isConsumable;
                    } else if (catalogSubTab === 'consumables') {
                        matchesType = !!i.isConsumable;
                    }
                    
                    return matchesQuery && matchesCat && matchesType;
                });
            }, [inventory, searchQuery, categoryFilter, catalogSubTab]);

            // Filtered Inventory for Instructor view
            const filteredInstructorInventory = useMemo(() => {
                return inventory.filter(i => {
                    if (inventorySubTab === 'equipment') return !i.isConsumable;
                    if (inventorySubTab === 'consumables') return !!i.isConsumable;
                    return true;
                });
            }, [inventory, inventorySubTab]);

            const equipmentCount = useMemo(() => inventory.filter(i => !i.isConsumable).length, [inventory]);
            const consumablesCount = useMemo(() => inventory.filter(i => !!i.isConsumable).length, [inventory]);

            return (
                <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
                    
                    {/* PINNED TOP AREA (header + connection bar). Not pinned while the setup panel is open, since it is tall. */}
                    <div ref={topBarRef} className={cloudSettingsOpen ? '' : 'sticky top-0 z-30'}>
                    {/* TOP BRAND HEADER */}

                        <div className="flex items-center gap-3">
                            <div className="bg-sky-600 p-2 rounded-xl text-white shadow-lg shadow-sky-600/30">
                                <i data-lucide="wrench" className="w-5 h-5"></i>
                            </div>
                            <div>
                                <h1 className="text-lg font-bold tracking-tight bg-gradient-to-r from-sky-400 via-indigo-300 to-amber-400 bg-clip-text text-transparent flex items-center gap-2">
                                    LabTrack Live
                                    <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800 flex items-center gap-1">
                                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                                        LIVE SYNC
                                    </span>
                                </h1>
                                <p className="text-xs text-slate-400">Multi-Device Pre-Engineering Material & Tool Manager</p>
                            </div>
                        </div>

                        {/* Top Action Switcher & QR Code Launcher */}
                        <div className="flex items-center gap-2 flex-wrap">

                                className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-colors"
                                title="Copy direct link for student smartphones"
                            >
                                <i data-lucide="share-2" className="w-3.5 h-3.5 text-sky-400"></i>
                                Share Link
                            </button>

                                className="px-3 py-1.5 bg-sky-950 hover:bg-sky-900 text-sky-300 border border-sky-800 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-colors"

                    </header>

                                <button type="button" onClick={()=>setCloudSettingsOpen(!cloudSettingsOpen)} className="px-3 py-2 rounded bg-slate-800">Connection setup</button>

                                                        const file = e.target.files && e.target.files[0];
                                                        if (!file) return;
                                                        const reader = new FileReader();
                                                        e.target.value = '';
                                                        reader.onload = async (event) => {
                                                            let parsed;
                                                            try { parsed = JSON.parse(event.target.result); }
                                                            catch (err) { showToast('That file is not a LabTrack backup.', 'error'); return; }
                                                            const items = Array.isArray(parsed.inventory) ? parsed.inventory.filter(i => i && i.id) : [];
                                                            const reqs = Array.isArray(parsed.requests) ? parsed.requests.filter(r => r && r.id) : [];
                                                            if (!items.length && !reqs.length) { showToast('That file is not a LabTrack backup.', 'error'); return; }
                                                            const when = parsed.exportedAt ? new Date(parsed.exportedAt).toLocaleString() : 'an unknown date';
                                                            if (!window.confirm(`Import backup from ${when}?\n\n${items.length} items and ${reqs.length} requests will be written to the shared database. Anything in the backup replaces the current version. Items and requests that are not in the backup are left alone.`)) return;
                                                            try {
                                                                requireConnection(true);
                                                                if (!(window.FB && authUser && isInstructorUnlocked)) throw new Error('Sign in as instructor first.');
                                                                if (parsed.cachedImages) {
                                                                    localStorage.setItem(IMAGE_CACHE_KEY, JSON.stringify(parsed.cachedImages));
                                                                }
                                                                const { db, appId, doc, setDoc } = window.FB;
                                                                for (const item of items) {
                                                                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'inventory', item.id), item);
                                                                }
                                                                if(Array.isArray(parsed.projectOptions))await setDoc(doc(db,'artifacts',appId,'public','data','inventory',PROJECT_SETTINGS_ID),{recordType:'project-options',projectOptions:normalizeProjectOptions(parsed.projectOptions),updatedAt:new Date().toISOString()});

                                                                let restored = 0, blocked = 0;
                                                                for (const r of reqs) {
                                                                    const { id, ...data } = r;
                                                                    try { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'requests', id), data); restored++; }
                                                                    catch (err) { if (err.code === 'permission-denied') blocked++; else throw err; }
                                                                }

                                                                    setCloudError(`${blocked} deleted request(s) could not be restored because your Firestore rules are out of date. Open "Connection setup", copy the Firestore rules, publish them in the Firebase console, then import again.`);

                                                                } else {
                                                                    showToast(`Imported ${items.length} items and ${restored} requests.`, 'success');
                                                                }
                                                            } catch (err) {
                                                                setCloudError('Import stopped: ' + err.message);
                                                                showToast('Import did not finish. See the message at the top.', 'error');
                                                            }
                                                        };
                                                        reader.readAsText(file);
                                                    }}
                                                />
